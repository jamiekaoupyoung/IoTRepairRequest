body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:0 20px;min-height:56px;background:var(--top);color:#fff;flex-wrap:wrap}

.tab{height:56px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;color:#fff;opacity:.8}

.note{font-size:12px;color:var(--mut);margin:0 0 12px}

.tbl{background:var(--surf);border:1px solid var(--line);border-radius:8px;overflow-x:auto}

.r.sel{background:var(--accbg)}.r:hover{background:var(--accbg)}
.r small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.tg{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;font-style:normal;margin-right:4px}

showMod('<div class="mod" role="dialog" aria-modal="true" aria-label="新增報修單"><h3>新增報修單</h3><p class="note">新增的報修單只存在這個瀏覽器，不會寫回原系統。</p><label for="f-u">報修單位（必填）</label><input id="f-u" list="f-ul"><datalist id="f-ul">'+us.map(function(u){return'<option value="'+esc(u)+'">'}).join('')+'</datalist><label for="f-l">機號位置</label><input id="f-l" placeholder="例如 3樓 洗衣間-洗衣機：HUWNBX-A0000"><label for="f-c">ControllerID（選填）</label><input id="f-c"><label for="f-w">報修方式</label><select id="f-w"><option>客服報修</option><option>自主檢查</option></select><label for="f-d">報修情況（必填）</label><textarea id="f-d"></textarea><label for="f-t">異常分類</label><select id="f-t">'+TY.map(function(y){return'<option value="'+esc(y.id)+'">'+esc(y.name)+'</option>'}).join('')+'<option value="未分類" selected>未分類</option></select><small class="note" id="f-auto"></small><div class="hint" id="f-h"></div><div class="err" id="f-err"></div><div class="row2" style="margin-top:14px"><button class="btn" id="f-cancel">取消</button><button class="btn p1" id="f-ok">送出</button></div></div>');$('f-u').focus()}

function openTs(){S.ts=TY.map(function(y){return{id:y.id,name:y.name,kw:y.kw,tip:y.tip}});renderTs()}

showMod('<div class="mod wide" role="dialog" aria-modal="true" aria-label="故障類型設定"><div class="mh"><h3>故障類型設定</h3><button class="btn" id="mod-close" style="padding:0 14px">關閉</button></div><p class="note">資料中已有的類型會自動列入（含不在你清單內的 '+EXTRA.length+' 種）。改名會套用到所有案件；刪除的類型，其案件會歸入「其他」。「其他」不能改名或刪除。關鍵字用於新增報修單時自動分類。</p><div class="tsw"><div class="tsr h"><span>名稱</span><span>自動分類關鍵字</span><span>建議處置</span><span>筆數</span><span></span></div>'+rows+'</div><div class="err">'+(err||'')+'</div><div class="row2" style="margin-top:12px"><button class="btn" id="ts-add">＋ 新增類型</button><button class="btn" id="ts-reset">還原預設</button></div><div class="row2" style="margin-top:8px"><button class="btn" id="mod-close2">取消</button><button class="btn p1" id="ts-save">儲存</button></div></div>')}

TY=S.ts.map(function(y){return{id:y.id,name:y.name.trim(),kw:y.kw.trim(),tip:y.tip.trim()}});mkTYM();ls('rp-types3',TY);if(S.ty!=='all'&&S.ty!=='未分類'&&!TYM[S.ty])S.ty='all';closeMod();render();toast('已儲存故障類型')}

showMod('<div class="mod wide" role="dialog" aria-modal="true" aria-label="編輯報修單"><div class="mh"><h3>編輯報修單　'+esc(r.no)+'</h3></div><p class="note">修改只存在這個瀏覽器，不會寫回原系統。回覆天數與排除天數會依日期自動計算。</p><div class="ef2">'+
'<div><label for="ef-d">報修日期</label><input type="date" id="ef-d" value="'+esc(r.d)+'"></div>'+
'<div><label for="ef-w">報修方式</label><select id="ef-w">'+opt(ws,r.w)+'</select></div>'+

'<div><label for="ef-fw">韌體</label><input id="ef-fw" value="'+esc(r.fw||'')+'"></div>'+
'<div><label for="ef-s">處理進度</label><select id="ef-s">'+opt(STS,sOf(r))+'</select></div>'+
'<div><label for="ef-t">異常分類</label><select id="ef-t">'+TY.map(function(y){return'<option value="'+esc(y.id)+'">'+esc(y.name)+'</option>'}).join('')+'<option value="未分類">未分類</option></select></div>'+
'<div><label for="ef-rd">回覆日期</label><input type="date" id="ef-rd" value="'+esc(r.rd||'')+'"></div>'+
'<div><label for="ef-ed">排除日期</label><input type="date" id="ef-ed" value="'+esc(r.ed||'')+'"></div></div>'+
'<label for="ef-ds">報修情況</label><textarea id="ef-ds">'+esc(r.ds||'')+'</textarea>'+
'<label for="ef-tx">交易時間（金額-支付方式-時間，多筆以分號分隔）</label><textarea id="ef-tx" style="height:60px">'+esc(r.tx||'')+'</textarea>'+
'<label for="ef-nt">處理回報（每行：姓名: 日期 內容）</label><textarea id="ef-nt" style="height:110px">'+esc(r.nt||'')+'</textarea><div class="err" id="ef-err"></div><div class="row2" style="margin-top:14px"><button class="btn" id="f-cancel">取消</button><button class="btn p1" id="ef-ok">儲存</button></div></div>');$('ef-t').value=tOf(r)}
function saveEdit(){var r=REC[S.sel],g=function(id){return $(id).value.trim()},nv={d:g('ef-d'),u:g('ef-u'),loc:g('ef-l')||null,cid:g('ef-c')||null,w:g('ef-w')||null,fw:g('ef-fw')||null,rd:g('ef-rd')||null,ed:g('ef-ed')||null,ds:g('ef-ds')||null,tx:g('ef-tx')||null,nt:g('ef-nt')||null},er=function(m){$('ef-err').textContent=m};
if(!nv.d||!nv.u){er('報修日期與報修單位不能空白');return}if(nv.rd&&nv.rd<nv.d){er('回覆日期不能早於報修日期');return}if(nv.ed&&nv.ed<nv.d){er('排除日期不能早於報修日期');return}
var x=E[r.i]||{},n=0;x.f=x.f||{};Object.keys(nv).forEach(function(k){var cur=r[k]==null?null:String(r[k]);if(cur!==nv[k]){x.f[k]=nv[k];n++}});
if(nv.d!==r.d||nv.rd!==(r.rd||null)||nv.ed!==(r.ed||null)){x.f.rn=nv.rd?dd(nv.d,nv.rd)+1:null;x.f.en=nv.ed?dd(nv.d,nv.ed)+1:null}
if($('ef-s').value!==sOf(r)){x.s=$('ef-s').value;n++}if($('ef-t').value!==tOf(r)){x.ty=$('ef-t').value;n++}
if(!n){closeMod();toast('沒有變更');return}E[r.i]=x;save();build();closeMod();render();toast('已儲存變更（僅存本機）')}

function setView(v){S.view=v;['list','cmp','dash'].forEach(function(k){$('v-'+k).hidden=v!==k;$('t-'+k).className='tab'+(v===k?' on':'')});render()}
function render(){S.view==='list'?list():S.view==='cmp'?cmp():dash()}
function save(){ls('rp3-edits',E)}

document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t){if(e.target.id==='ov')closeMod();return}var d=t.dataset,i,r;
if(t.id==='t-list')setView('list');else if(t.id==='t-cmp')setView('cmp');else if(t.id==='t-dash')setView('dash');
else if(d.rk){setRk(d.rk);render()}
else if(d.f){S.f=d.f;S.pg=0;list()}else if(d.i){S.sel=+d.i;list()}else if(d.pg){S.pg+=+d.pg;list()}
else if(d.cf){S.cf=d.cf;S.cpg=0;S.tsel=null;cmp()}else if(d.ti){S.tsel=+d.ti;cmp()}else if(d.tpg){S.cpg+=+d.tpg;S.tsel=null;cmp()}
else if(d.goto){S.sel=+d.goto;list()}
else if(d.open){r=REC[+d.open];if(!inR(r))setRk('all');S.f='all';S.ty='all';S.w='all';S.q=r.no;S.sel=r.i;setView('list')}
else if(t.id==='tool-log')logMod(REC[S.sel]);else if(t.id==='tool-room')roomMod(REC[S.sel]);
else if(d.goto2){S.sel=+d.goto2;closeMod();setView('list')}
else if(t.id==='mod-close'||t.id==='mod-close2'||t.id==='f-cancel')closeMod();

else if(t.id==='new')openForm();else if(t.id==='f-ok')submitForm();
else if(t.id==='edit-open')openEdit(REC[S.sel]);else if(t.id==='ef-ok')saveEdit();
else if(t.id==='del-local'){if(S.delArm!==S.sel){S.delArm=S.sel;list();toast('再按一次確認刪除')}else delLocal()}
else if(t.id==='edit-reset'){delete E[S.sel];save();reloadData();list();toast('已還原此單的本機修改')}
else if(t.id==='tset')openTs();
else if(t.id==='ts-add'){S.ts.push({id:'c'+Date.now(),name:'',kw:'',tip:''});renderTs()}
else if(t.id==='ts-reset'){var df=defTypes();S.ts=df;renderTs()}

else if(d.tdn!==undefined){i=+d.tdn;S.ts.splice(i+1,0,S.ts.splice(i,1)[0]);renderTs()}
else if(t.id==='clear'){BASE=JSON.parse($('data').textContent);NEW=[];E={};TY=defTypes();mkTYM();ls('rp3-new',null);ls('rp3-edits',null);ls('rp-types3',null);build();setRk('30');S.sel=null;S.f='all';S.q='';S.ty='all';S.w='all';render();toast('已清除本機的修改、新增與類型設定')}});
document.addEventListener('change',function(e){var el=e.target,id=el.id;
if(el.classList.contains('rgi')){S.rg[el.dataset.k]=el.value;render()}
else if(id==='sort'){S.sort=el.value;S.pg=0;list()}else if(id==='ftype'){S.ty=el.value;S.pg=0;list()}else if(id==='fway'){S.w=el.value;S.pg=0;list()}
else if(id==='e-st'){ed(S.sel).s=el.value;save();list();toast('狀態已改為 '+el.value+'（僅存本機）')}
else if(id==='e-ty'){ed(S.sel).ty=el.value;save();list()}
else if(id==='f-t'){S.auto=false;$('f-auto').textContent=''}});

setView('list');
